# Apache mod_shib integration for SOGo5 sidecar
# SPDX-License-Identifier: Apache-2.0
#
# /Shibboleth.sso/* handled by mod_shib; everything else proxied to SOGo on 127.0.0.1:20000.
# mod_shib sets REMOTE_USER (eppn after successful auth), SOGo trusts it.

# mod_shib is loaded via a2enmod shib -> mods-enabled/shib.load
# (LoadModule mod_shib /usr/lib/apache2/modules/mod_shib.so)

# Shibboleth SP handler locations (must stay on /Shibboleth.sso)
<Location /Shibboleth.sso>
    SetHandler shib
</Location>

<Location /Shibboleth.sso/Secure>
    AuthType shibboleth
    ShibRequireSession On
    ShibUseHeaders On
    require shibboleth
</Location>

# Everything else: proxy to SOGo (handle SOGo in the same location to keep
# ShibRequestSetting for the whole app path).
<Location />
    AuthType shibboleth
    ShibRequireSession On
    ShibUseHeaders On
    require shibboleth

    ProxyPass http://127.0.0.1:20000/
    ProxyPassReverse http://127.0.0.1:20000/
</Location>

# Handle the metadata for federation registration
<Location /Shibboleth.sso/Metadata>
    SetHandler shib
</Location>

# Fix proxy headers
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
