# SOGo 5 Service Configuration
# SPDX-License-Identifier: Apache-2.0
---
# ClusterIP Service for SOGo Web Interface
apiVersion: v1
kind: Service
metadata:
  name: sogo5-web
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/version: "5.8.0"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: sogo5-sso
    app.kubernetes.io/managed-by: kustomize
    
    example.org/component: mail-calendar-contacts
    example.org.service-type: web
    
    de.container.gov.component: sogo5
    de.container.gov.service: web

spec:
  selector:
    app: sogo
    version: "5.8.0"
    component: app
  
  ports:
    # HTTP port (SOGo Web Interface)
    # Shib-Sidecar (Apache+mod_shib) fronts SOGo on the same pod IP.
    # Port 80 on the pod belongs to the shibboleth-sp sidecar; it proxies
    # to SOGo on 127.0.0.1:20000. (targetPort 20000 would bypass Shib.)
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    
    # HTTPS port (sidecar Apache TLS)
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP

  sessionAffinity: ClientIP
  type: ClusterIP

---
# Headless Service for direct pod access
apiVersion: v1
kind: Service
metadata:
  name: sogo5-headless
  namespace: sogo5
  labels:
    app.kubernetes.io/name: sogo
    app.kubernetes.io/instance: sogo5
    app.kubernetes.io/version: "5.8.0"
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: sogo5-sso
    app.kubernetes.io/managed-by: kustomize
    
    example.org/service-type: headless

spec:
  clusterIP: None
  selector:
    app: sogo
    version: "5.8.0"
    component: app
  
  ports:
    - name: http
      port: 20000
      targetPort: 20000
      protocol: TCP
    - name: https
      port: 20001
      targetPort: 20001
      protocol: TCP
    - name: dav
      port: 20002
      targetPort: 20002
      protocol: TCP

---
