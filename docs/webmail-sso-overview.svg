<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <title>SOGo5 SSO — webmail single sign-on without breaking mail clients</title>
  <desc>Architecture sketch: SSO is confined to the webmail path (browser, Shibboleth SP sidecar, SOGo, IdP, JWKS). Mail clients keep using their existing credentials against IMAP/SMTP unchanged.</desc>

  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ==================== Hintergrund ==================== -->
  <rect x="0" y="0" width="1280" height="860" fill="#ffffff"/>
  <text x="640" y="46" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f172a">SOGo 5 SSO — webmail single sign-on without breaking mail clients</text>
  <text x="640" y="76" text-anchor="middle" font-size="16" fill="#475569">SSO lives only on the webmail path · every other mail client keeps working unchanged</text>

  <!-- ==================== Zone Webmail-SSO (blau) ==================== -->
  <rect x="620" y="96" width="620" height="380" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="930" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">① WEBMAIL SSO PATH</text>

  <!-- IdP -->
  <rect x="60" y="120" width="300" height="120" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="210" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">Identity Provider</text>
  <text x="210" y="176" text-anchor="middle" font-size="13" fill="#78350f">Shibboleth IdP 5 · SAML + OIDC plugin</text>
  <text x="210" y="196" text-anchor="middle" font-size="13" fill="#78350f">publishes SLO + JWKS (token keys)</text>
  <text x="210" y="216" text-anchor="middle" font-size="12" fill="#b45309">end session · scopes · sub → mailbox uid</text>

  <!-- Browser -->
  <rect x="60" y="330" width="300" height="120" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="210" y="362" text-anchor="middle" font-size="17" font-weight="bold" fill="#075985">Browser (human)</text>
  <text x="210" y="386" text-anchor="middle" font-size="13" fill="#0c4a6e">webmail login via SSO</text>
  <text x="210" y="406" text-anchor="middle" font-size="13" fill="#0c4a6e">OIDC token, no stored password</text>
  <text x="210" y="428" text-anchor="middle" font-size="12" fill="#0369a1">/Shibboleth.sso/* · authorize · callback</text>

  <!-- Mail Clients (grün) -->
  <rect x="60" y="560" width="300" height="120" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="210" y="592" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">Mail clients (unchanged)</text>
  <text x="210" y="616" text-anchor="middle" font-size="13" fill="#14532d">Thunderbird · Outlook · K-9, …</text>
  <text x="210" y="636" text-anchor="middle" font-size="13" fill="#14532d">saved password / app password / XOAUTH2</text>
  <text x="210" y="656" text-anchor="middle" font-size="12" fill="#15803d">never part of the SSO flow</text>

  <!-- Webmail Pod -->
  <rect x="700" y="150" width="540" height="160" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="970" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Kubernetes pod · sogo5 (one network namespace)</text>

  <!-- Sidecar -->
  <rect x="730" y="192" width="240" height="92" rx="10" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="850" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">SP sidecar</text>
  <text x="850" y="238" text-anchor="middle" font-size="12.5" fill="#1e40af">Apache + mod_shib (shibd)</text>
  <text x="850" y="256" text-anchor="middle" font-size="12.5" fill="#1e40af">terminates SAML session</text>
  <text x="850" y="274" text-anchor="middle" font-size="12.5" fill="#1e40af">sets REMOTE_USER (uid / eppn)</text>

  <!-- SOGo -->
  <rect x="1000" y="192" width="210" height="92" rx="10" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="1105" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">SOGo 5 webmail</text>
  <text x="1105" y="238" text-anchor="middle" font-size="12.5" fill="#1e40af">sogod :20000</text>
  <text x="1105" y="256" text-anchor="middle" font-size="12.5" fill="#1e40af">trusts proxy auth header</text>
  <text x="1105" y="274" text-anchor="middle" font-size="12.5" fill="#1e40af">or native OIDC (end state)</text>

  <!-- LDAP -->
  <rect x="730" y="332" width="210" height="84" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="835" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">LDAP directory</text>
  <text x="835" y="378" text-anchor="middle" font-size="12.5" fill="#475569">users, uid, mail attributes</text>
  <text x="835" y="396" text-anchor="middle" font-size="12.5" fill="#475569">read-only attribute source</text>

  <!-- Mail server -->
  <rect x="700" y="560" width="540" height="160" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
  <text x="970" y="590" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">② MAIL BACKEND (protocol servers)</text>
  <text x="970" y="614" text-anchor="middle" font-size="13" fill="#7f1d1d">IMAP / POP3 / SMTP / Sieve</text>
  <text x="970" y="636" text-anchor="middle" font-size="13" fill="#7f1d1d">Dovecot · Stalwart · Postfix …</text>
  <text x="970" y="660" text-anchor="middle" font-size="13" fill="#7f1d1d">validates XOAUTH2 against IdP JWKS (local JWT)</text>
  <text x="970" y="684" text-anchor="middle" font-size="12.5" fill="#991b1b">no shared introspection secret · no master account</text>

  <!-- ==================== Pfeile ==================== -->
  <!-- Browser <-> IdP (SAML session) -->
  <path d="M225,330 C225,280 225,260 225,252" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrOrange)"/>
  <text x="380" y="296" font-size="12" fill="#b45309">SAML session / OIDC tokens</text>

  <!-- Browser -> Sidecar (HTTPS) -->
  <path d="M360,395 C480,395 620,280 726,260" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <text x="500" y="385" text-anchor="middle" font-size="12.5" fill="#1d4ed8">HTTPS — browser SSO login</text>

  <!-- Sidecar -> SOGo -->
  <path d="M972,240 L996,240" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="984" y="230" text-anchor="middle" font-size="11.5" fill="#1d4ed8">REMOTE_USER</text>

  <!-- SOGo <-> IdP (OIDC end state, dashed) -->
  <path d="M1105,192 C1105,120 560,200 366,206" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrOrange)"/>
  <text x="560" y="100" text-anchor="end" font-size="12" fill="#b45309">OIDC end state: token validated against IdP JWKS</text>

  <!-- SOGo -> LDAP -->
  <path d="M1000,238 C960,280 945,290 945,328" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/>
  <text x="990" y="292" font-size="11.5" fill="#475569">LDAP attrs</text>

  <!-- SOGo -> Mail backend (send as user) -->
  <path d="M1105,286 C1105,420 1020,520 985,558" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="1085" y="470" text-anchor="middle" font-size="12.5" fill="#1d4ed8">mail access as user (XOAUTH2)</text>

  <!-- Mail client -> backend (unchanged) -->
  <path d="M360,650 C520,700 700,700 706,676" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrGreen)"/>
  <text x="536" y="638" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">password / XOAUTH2 — unchanged</text>

  <!-- ==================== Fazit-Badge ==================== -->
  <rect x="60" y="730" width="1160" height="86" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="640" y="758" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">The point: one browser SSO login — but never a credential for Thunderbird &amp; co.</text>
  <text x="640" y="782" text-anchor="middle" font-size="13" fill="#334155">Single sign-on stays inside the webmail path; IMAP/SMTP clients with saved passwords keep working — no mail breakage, no second-class users.</text>
  <text x="640" y="804" text-anchor="middle" font-size="12" fill="#64748b">phases: ① SAML SP sidecar (proven) → ② native OIDC + XOAUTH2 via published JWKS (decided end state)</text>
</svg>
